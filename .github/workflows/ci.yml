name: CI

# Test gate: type check + vitest on every push to main and every pull request.
# It does NOT deploy; `npm run deploy` is a decision a person makes. The tests
# use node:sqlite, so Node 22 or newer is required.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Tests
        run: npm test
